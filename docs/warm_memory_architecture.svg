<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-label="WarmMemory architecture diagram">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b341e"/>
    </marker>
    <marker id="arrow-loop" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6848"/>
    </marker>
  </defs>

  <rect width="1400" height="620" fill="#fffaf3"/>

  <!-- User Query -->
  <rect x="50" y="235" width="180" height="86" rx="18" fill="#f3d5c7" stroke="#b8572f" stroke-width="3"/>
  <text x="140" y="272" text-anchor="middle" font-size="26" fill="#1f2933" font-family="Georgia, serif">User Query</text>
  <text x="140" y="300" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">new request</text>

  <!-- Agent Runtime -->
  <rect x="300" y="215" width="240" height="126" rx="18" fill="#fff7ea" stroke="#c19a6b" stroke-width="3"/>
  <text x="420" y="262" text-anchor="middle" font-size="28" fill="#1f2933" font-family="Georgia, serif">Agent Runtime</text>
  <text x="420" y="292" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">decorator captures</text>
  <text x="420" y="316" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">input / output</text>

  <!-- WarmMemory -->
  <rect x="610" y="90" width="270" height="118" rx="20" fill="#eef8f1" stroke="#1f7a54" stroke-width="3"/>
  <text x="745" y="136" text-anchor="middle" font-size="28" fill="#1f2933" font-family="Georgia, serif">WarmMemory</text>
  <text x="745" y="166" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">in-memory working set</text>
  <text x="745" y="190" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">recent | relevant | retain</text>

  <!-- Retrieval Ranker -->
  <rect x="610" y="350" width="270" height="118" rx="20" fill="#fff7ea" stroke="#c19a6b" stroke-width="3"/>
  <text x="745" y="396" text-anchor="middle" font-size="28" fill="#1f2933" font-family="Georgia, serif">Retrieval Ranker</text>
  <text x="745" y="422" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">importance scoring</text>
  <text x="745" y="446" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">heuristic now | model later</text>

  <!-- Warm Hit? diamond -->
  <polygon points="985,215 1065,275 985,335 905,275" fill="#fcf7f0" stroke="#8a5a00" stroke-width="3"/>
  <text x="985" y="270" text-anchor="middle" font-size="24" fill="#1f2933" font-family="Georgia, serif">Warm Hit?</text>
  <text x="985" y="292" text-anchor="middle" font-size="15" fill="#52606d" font-family="Georgia, serif">enough context</text>

  <!-- Prompt Builder -->
  <rect x="1130" y="95" width="220" height="110" rx="18" fill="#fcf7f0" stroke="#8a5a00" stroke-width="3"/>
  <text x="1240" y="138" text-anchor="middle" font-size="28" fill="#1f2933" font-family="Georgia, serif">Prompt Builder</text>
  <text x="1240" y="168" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">top K memory only</text>

  <!-- Long-Term Memory -->
  <rect x="1130" y="355" width="220" height="110" rx="18" fill="#fff3f0" stroke="#b8572f" stroke-width="3"/>
  <text x="1240" y="398" text-anchor="middle" font-size="28" fill="#1f2933" font-family="Georgia, serif">Long-Term Memory</text>
  <text x="1240" y="428" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">vector DB | SQL | logs</text>

  <!-- LLM Response -->
  <rect x="1130" y="235" width="220" height="78" rx="18" fill="#f3d5c7" stroke="#b8572f" stroke-width="3"/>
  <text x="1240" y="283" text-anchor="middle" font-size="28" fill="#1f2933" font-family="Georgia, serif">LLM Response</text>

  <!-- ─── Forward flow arrows (solid) ─── -->

  <!-- User Query → Agent Runtime -->
  <line x1="230" y1="278" x2="297" y2="278" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Agent Runtime → WarmMemory -->
  <line x1="540" y1="245" x2="607" y2="155" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Agent Runtime → Retrieval Ranker -->
  <line x1="540" y1="315" x2="607" y2="400" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- WarmMemory → diamond -->
  <line x1="880" y1="165" x2="945" y2="245" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Retrieval Ranker → diamond -->
  <line x1="880" y1="400" x2="945" y2="308" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- diamond → yes → Prompt Builder -->
  <line x1="1035" y1="242" x2="1127" y2="170" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1112" y="198" text-anchor="start" font-size="16" fill="#1f7a54" font-family="Georgia, serif" font-weight="bold">yes</text>

  <!-- diamond → no → Long-Term Memory -->
  <line x1="1035" y1="308" x2="1127" y2="390" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1112" y="368" text-anchor="start" font-size="16" fill="#8a5a00" font-family="Georgia, serif" font-weight="bold">no</text>

  <!-- Prompt Builder → LLM Response -->
  <line x1="1240" y1="205" x2="1240" y2="232" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Long-Term Memory → LLM Response -->
  <line x1="1240" y1="355" x2="1240" y2="316" stroke="#7b341e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1290" y="338" font-size="15" fill="#52606d" font-family="Georgia, serif">fallback</text>

  <!-- ─── Feedback loops (dashed, routed outside all boxes) ─── -->

  <!-- LLM Response → Agent Runtime (exits left, sweeps below everything) -->
  <path d="M 1130 274 C 1080 274, 1080 570, 750 570 C 420 570, 420 440, 420 341" fill="none" stroke="#8a6848" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-loop)"/>
  <text x="750" y="596" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">capture output</text>

  <!-- Agent Runtime → WarmMemory (exits top-left, arcs above everything) -->
  <path d="M 350 215 C 350 30, 680 30, 680 90" fill="none" stroke="#8a6848" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-loop)"/>
  <text x="515" y="20" text-anchor="middle" font-size="16" fill="#52606d" font-family="Georgia, serif">write to WarmMemory</text>
</svg>
