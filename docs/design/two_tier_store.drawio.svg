    <marker id="arrow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7e8590"/>
    </marker>
  </defs>
  <path d="M590,100 L590,180" stroke="#8b949e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="610" y="145" text-anchor="start" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="500">search / put / get / delete</text><path d="M420,290 L260,380" stroke="#3fb950" stroke-width="2.5" fill="none" marker-end="url(#arrow-hit)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.9s" repeatCount="indefinite"/></path><text x="310" y="322" text-anchor="middle" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">1. search warm</text><path d="M180,380 L380,290" stroke="#3fb950" stroke-width="2.5" fill="none" marker-end="url(#arrow-hit)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.9s" repeatCount="indefinite"/></path><text x="165" y="360" text-anchor="start" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">hit → return</text><path d="M760,290 L920,380" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#arrow-miss)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.9s" repeatCount="indefinite"/></path><text x="830" y="322" text-anchor="start" fill="#f0883e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">2. miss → search durable</text><path d="M1000,380 L800,290" stroke="#f0883e" stroke-width="2.5" fill="none" marker-end="url(#arrow-miss)" stroke-dasharray="10 6"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.9s" repeatCount="indefinite"/></path><text x="990" y="360" text-anchor="end" fill="#f0883e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700">result → populate warm + return</text><path d="M520,290 L200,380" stroke="#7e8590" stroke-width="2" fill="none" marker-end="url(#arrow-write)" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.4s" repeatCount="indefinite"/></path><path d="M660,290 L980,380" stroke="#7e8590" stroke-width="2" fill="none" marker-end="url(#arrow-write)" stroke-dasharray="6 5"><animate attributeName="stroke-dashoffset" from="11" to="0" dur="1.4s" repeatCount="indefinite"/></path><text x="590" y="380" text-anchor="middle" fill="#7e8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">put / delete → mirror to both (write-through)</text>
  <rect x="40" y="557" width="1100" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="590" y="582" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Restart / redeploy: WarmStore is empty on boot. Durable is intact. First reads miss warm and populate it — cache rehydrates in minutes.</text>
  <g><rect x="430" y="30" width="320" height="70" rx="8" fill="#102A4D" stroke="#58A6FF" stroke-width="2"/><text x="590.0" y="56" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">Your LangGraph Agent</text><text x="590.0" y="78" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">compiled_graph.compile(store=TwoTierStore(warm, durable))</text></g><g><rect x="310" y="180" width="560" height="110" rx="8" fill="#3A2E10" stroke="#D29922" stroke-width="2"/><text x="590.0" y="206" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">TwoTierStore  (BaseStore wrapper)</text><text x="590.0" y="228" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• search → warm first; if best score &lt; threshold, fall back to durable</text><text x="590.0" y="244" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• put / delete → mirror to both stores (write-through)</text><text x="590.0" y="260" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• list_namespaces, batch / abatch → forward to durable for ground truth</text><text x="590.0" y="276" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">no orchestration code in your agent — pretend it's a single BaseStore</text></g><g><rect x="40" y="380" width="320" height="160" rx="8" fill="#3A1F1A" stroke="#F78166" stroke-width="2"/><text x="200.0" y="406" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">WarmStore (warm tier)</text><text x="200.0" y="428" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• in-process pandas buffer</text><text x="200.0" y="444" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• per-namespace capacity bound</text><text x="200.0" y="460" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• keyword / embeddings scorer</text><text x="200.0" y="476" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• ephemeral — dies on restart</text><text x="200.0" y="492" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• O(namespaces × capacity) memory</text></g><g><rect x="810" y="380" width="320" height="160" rx="8" fill="#2B1F3D" stroke="#A371F7" stroke-width="2"/><text x="970.0" y="406" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">DurableStore (cold tier)</text><text x="970.0" y="428" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">any LangGraph BaseStore:</text><text x="970.0" y="444" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• PostgresStore</text><text x="970.0" y="460" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• InMemoryStore + index</text><text x="970.0" y="476" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• your own vector DB wrapper</text><text x="970.0" y="492" text-anchor="middle" fill="#cdd9e5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="400">• persistent — survives restarts</text></g>
</svg>
