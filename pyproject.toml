[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WarmMemory"
version = "0.1.0"
description = "Pandas-backed in-memory interaction buffer for agent research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
]

[project.optional-dependencies]
langgraph = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
]

[tool.setuptools.packages.find]
include = ["warm_memory*"]
